# ==============================================================================
# THE CLAUDE PACK
# ==============================================================================
# What the socle needs to know about it, and nothing more: the folder under
# packs/ is the registration - a pack is installed exactly when its folder is
# in ~/.config/packs - and no other file names the pack.
#
# Claude Code, the agentic CLI, in the instance: a terminal program, installed
# under the user's own ~/.local from Anthropic's script - no apt package, no
# root, no Node (the image carries none, so the npm route is not this one).

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make.
PACK_DESCRIPTION := Claude Code, the agentic CLI (about 230 MB)

# The apt family: a pack is only offered on a machine of the same one.
PACK_FAMILY := debian

# What apt will never see, declared like PACK_PACKAGES: a neighbouring pack
# asks this line before taking a name away. `claude` is a binary in
# ~/.local/bin pointing into ~/.local/share/claude/versions/ - the same place
# uv lives for the other packs.
PACK_OUTSIDE_APT := claude

# No PACK_PACKAGES: nothing this pack installs comes from apt.
# zsh: the shell socle - every visible pack stands on it.
PACK_REQUIRES := zsh
