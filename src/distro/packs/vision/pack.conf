# ==============================================================================
# THE VISION PACK
# ==============================================================================
# What the socle needs to know about it, and nothing more: the folder under
# packs/ is the registration - no other file names the pack - and this one has
# no make/*.mk at all: it brings tools, not targets.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make.
PACK_DESCRIPTION := ffmpeg, ImageMagick and Tesseract OCR (about 500 MB installed)

# zsh: the shell socle - every visible pack stands on it.
PACK_REQUIRES := zsh

# The system packages, named once: install_root.sh installs them, remove.sh
# removes them, a neighbour reads this line before taking one away.
# tesseract-ocr-fra: the base package only reads English - the other languages
# are a `apt-get install tesseract-ocr-<code>` away. Only programs, never a
# library, no autoremove.
PACK_PACKAGES := ffmpeg imagemagick tesseract-ocr tesseract-ocr-fra
