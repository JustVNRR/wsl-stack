<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Undercover Browser</title>
<style>
  /* One Half Dark, the scheme the terminal wears: the white was violent. */
  :root { color-scheme: dark; }
  body { background: #282c34; color: #dcdfe4; font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 52rem; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  p.note { font-size: 0.85rem; opacity: 0.75; max-width: 44rem; }
  code { color: #e5c07b; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; margin-top: 1rem; }
  th, td { border: 1px solid #3e4451; padding: 0.35rem 0.6rem; text-align: left; vertical-align: top; }
  th { font-weight: 600; }
  td.ok { color: #98c379; font-weight: 700; }
  td.bad { color: #e06c75; font-weight: 700; }
  td.value { font-family: ui-monospace, monospace; word-break: break-all; }
  footer { font-size: 0.85rem; opacity: 0.75; margin-top: 1rem; }
</style>
</head>
<body>
<h1>Undercover Browser</h1>
<p class="note">Open <code>about:config</code> to consult Firefox's preferences.</p>
<table>
  <thead>
    <tr><th>Measured live</th><th>Value</th><th>Expected</th><th></th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<footer>
  <span id="exit-ip">Exit IP: asking…</span><br>
  <span id="dns-line">DNS: …</span>
</footer>

<script>
"use strict";

// The launcher puts the profile and the resolver in the fragment:
// #strict;dns=10.2.0.1
const parts = decodeURIComponent(location.hash.slice(1)).split(";");
const profile = parts[0] || "";
const dns = (parts.find(p => p.startsWith("dns=")) || "dns=").slice(4);
const strict = profile === "strict";
document.title += profile ? " - " + profile : "";

const rows = document.getElementById("rows");

// One table line; verdict: true, false, or null (no promise either way).
function add(name, value, expected, verdict) {
  const tr = document.createElement("tr");
  tr.innerHTML = "<td>" + name + "</td><td class='value'></td><td></td><td></td>";
  tr.children[1].textContent = value === "" ? "(empty)" : value;
  if (strict) tr.children[2].textContent = expected;
  if (strict && verdict !== null && verdict !== undefined) {
    tr.children[3].textContent = verdict ? "✓" : "✗";
    tr.children[3].className = verdict ? "ok" : "bad";
  }
  rows.appendChild(tr);
  return tr;
}

function later(row, value, verdict) {
  row.children[1].textContent = value;
  if (strict && verdict !== null && verdict !== undefined) {
    row.children[3].textContent = verdict ? "✓" : "✗";
    row.children[3].className = verdict ? "ok" : "bad";
  }
}

// RFP spoofs the time zone as Reykjavik (UTC+0) - since Firefox 128.
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
add("Time zone", tz, "Atlantic/Reykjavik (UTC+0)", tz === "Atlantic/Reykjavik");

// --- the language Firefox announces ------------------------------------------
add("Language", navigator.language, "en-US", navigator.language === "en-US");

// Since the UA reduction (Firefox 120), every Firefox sends the same plain
// shape - real platform included ("hiding Linux" is old behaviour).
const ua = navigator.userAgent;
add(
  "User-agent",
  ua,
  "the plain Firefox UA, nothing custom",
  /^Mozilla\/5\.0 \([^)]*\) Gecko\/20100101 Firefox\/[\d.]+$/.test(ua)
);

// RFP rounds the window a site sees to 200 x 100.
add(
  "Window size a site sees",
  window.innerWidth + " × " + window.innerHeight,
  "a multiple of 200 × 100",
  window.innerWidth % 200 === 0 && window.innerHeight % 100 === 0
);

// --- WebRTC: gone with the strict profile -------------------------------------
const rtc = typeof RTCPeerConnection;
add("RTCPeerConnection", rtc, "undefined", rtc === "undefined");

// RFP replaces every canvas read with fresh random bytes (the "poison
// pill"): two reads must differ - a real canvas gives the same one.
function canvasHash() {
  const c = document.createElement("canvas");
  c.width = 200; c.height = 50;
  const g = c.getContext("2d");
  g.textBaseline = "top";
  g.font = "16px monospace";
  g.fillStyle = "#f60";
  g.fillRect(0, 0, 200, 50);
  g.fillStyle = "#069";
  g.fillText("fingerprint me", 2, 2);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  let h = 0;
  for (let i = 0; i < d.length; i += 17) h = (h * 31 + d[i]) | 0;
  return (h >>> 0).toString(16);
}
let canvasVerdict, canvasOk;
try {
  const h1 = canvasHash();
  const h2 = canvasHash();
  if (h1 !== h2) { canvasVerdict = "random on every read - neutralized"; canvasOk = true; }
  else { canvasVerdict = "stable on two reads (" + h1 + ") - readable"; canvasOk = false; }
} catch (e) {
  canvasVerdict = "unreadable (" + e.name + ")";
  canvasOk = true;
}
add("Canvas, read twice", canvasVerdict, "random on every read", canvasOk);

// The permission state, read - never asked (a request pops a prompt).
const geoRow = add("Geolocation permission", "asking…", "denied", null);
navigator.permissions
  .query({ name: "geolocation" })
  .then(p => {
    if (p.state === "denied") later(geoRow, "denied", true);
    else if (p.state === "granted") later(geoRow, "granted", false);
    else later(geoRow, "would be asked (a local file is not remembered by the permission store)", null);
  })
  .catch(e => later(geoRow, "unknown (" + e.name + ")", null));

// doubleclick.net against a control: tracker blocked + control through =
// tracking content blocked. Both through = this local page is not where the
// shield acts (itisatracker.com would prove nothing - Mozilla's own, listed
// as allowed).
const trackerRow = add("doubleclick.net (a classic tracker)", "asking…", "blocked", null);
const probe = url =>
  fetch(url, { mode: "no-cors", cache: "no-store" }).then(() => "loaded", () => "not loaded");
Promise.all([probe("https://www.doubleclick.net/"), probe("https://example.com/")]).then(
  ([tracker, control]) => {
    if (control === "not loaded") later(trackerRow, "not conclusive (the network is down)", null);
    else if (tracker === "not loaded") later(trackerRow, tracker + " - tracking content blocked", true);
    else later(trackerRow, "loaded like the control - not conclusive from a local page", null);
  }
);

// --- what the internet sees right now, and the resolver: the footer -----------
const ipLine = document.getElementById("exit-ip");
fetch("https://ipinfo.io/json")
  .then(r => r.json())
  .then(j => {
    const place = [j.city, j.region, j.country].filter(Boolean).join(", ");
    ipLine.textContent = "Exit IP: " + (j.ip || "?") + (place ? " - " + place : "") + (j.org ? " (" + j.org + ")" : "");
  })
  .catch(() => {
    // ipinfo may not answer; ipify gives the IP alone.
    fetch("https://api.ipify.org?format=json")
      .then(r => r.json())
      .then(j => { ipLine.textContent = "Exit IP: " + j.ip + " (location service unavailable)"; })
      .catch(() => { ipLine.textContent = "Exit IP: unreachable"; });
  });

document.getElementById("dns-line").textContent = "DNS: " + (dns || "(not passed by the launcher)");

</script>
</body>
</html>
