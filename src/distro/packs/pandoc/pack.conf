# ==============================================================================
# THE PANDOC PACK
# ==============================================================================
# What the socle needs to know about it, and nothing more: the folder under
# packs/ is the registration - a pack is installed exactly when its folder is
# in ~/.config/packs - and no other file names the pack.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make.
PACK_DESCRIPTION := Pandoc and XeLaTeX (about 800 MB installed)

# The system packages, named once: install_root.sh installs them, remove.sh
# removes them, and a neighbouring pack reads this line before taking one away.
#
#   pandoc (--citeproc is part of the binary), texlive-xetex (the engine
#   fontspec templates ask for), texlive-latex-extra (tcolorbox, titlesec,
#   enumitem, xurl, csquotes...), texlive-fonts-recommended (hyperref asks for
#   pzdr under XeTeX without it), texlive-lang-french (babel-french),
#   fontconfig (fc-cache, for the fonts font_from_windows copies), poppler-utils
#   (pdftotext, pdfinfo, pdftoppm, pdfunite).
#
# Only programs here, never a library, and nothing is ever installed with
# autoremove: a library a neighbouring program depends on would take that
# program with it.
PACK_PACKAGES := pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-lang-french fontconfig poppler-utils
