# ==============================================================================
# THE PYTHON PACK
# ==============================================================================
# What the socle needs to know about it, and nothing more: the folder under
# packs/ is the registration - a pack is installed exactly when its folder is
# in ~/.config/packs - and no other file names the pack.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make.
PACK_DESCRIPTION := Python 3, uv, ruff and the compilation tools (about 530 MB installed)

# The apt family: a pack is only offered on a machine of the same one.
PACK_FAMILY := debian

# zsh: the shell socle - every visible pack stands on it, and its commands
# are what the targets below call. devops: the projects this pack makes
# usable are what its targets build, push and configure. scaffold: the act of
# creating a project is not python's - it is what calls init_venv back,
# through SCAFFOLD_AFTER_python in make/venv.mk.
PACK_REQUIRES := zsh devops scaffold

# No PACK_WELCOME: the line a fresh instance prints points at `fnew`, which is
# the scaffold pack's command - the sentence travels with what it names.

# The system packages, named once: install_root.sh installs them, remove.sh
# removes them, and a neighbour reads this line before taking one away. The four are
# the compiler and headers most Python wheels build against (numpy, pandas,
# psycopg2...): without them a project falls back to a precompiled wheel or
# fails to build. Only programs, never a library, no autoremove.
#
# uv is not here: it is not a Debian package - PACK_OUTSIDE_APT holds it, and
# install.sh puts it in ~/.local/bin when the scaffold pack has not already.
# The image does not carry it either: a toolchain that is not there is one a
# machine does not pay for.
PACK_PACKAGES := build-essential python3-dev libffi-dev libssl-dev

# What apt will never see, read like PACK_PACKAGES: a neighbour looks for it
# before taking it away. The scaffold pack declares uv too.
PACK_OUTSIDE_APT := uv
