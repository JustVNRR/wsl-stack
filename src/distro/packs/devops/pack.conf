# ==============================================================================
# THE DEVOPS PACK - THE PROJECT WORKSPACE
# ==============================================================================
# The targets that only make sense once a project exists: build its image, push
# its branch. The two .env commands stayed with the shell - the file they write
# is the one it loads before reading a single pack.
#
# The mirror of the vision pack: vision brings a tool and no target, devops
# targets and no tool. Everything it drives is already on the machine, so
# there is nothing to install and nothing to take back. No PACK_PACKAGES: a
# field nothing reads is not a safety.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make.
PACK_DESCRIPTION := Project targets: Docker, GitHub PRs

# The apt family: a pack is only offered on a machine of the same one.
PACK_FAMILY := debian

# Not offered, in any list: it arrives with the pack that requires it and
# leaves with the last one that does.
PACK_VISIBLE := no

# The variables refused in a shared .env.global: they identify ONE project, and
# this is the pack whose targets read them.
PACK_IDENTIFYING_VARS := DOCKER_LOCAL_IMAGE
