# ==============================================================================
# THE SCAFFOLD PACK - MAKING A PROJECT
# ==============================================================================
# The act of creating a project: the `fnew` picker, the three gmake targets it
# delegates to, and the .env every project wants.
#
# It requires nobody and it is nobody's choice, like devops: it arrives with the
# first pack that needs it and leaves with the last one that does.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make.
PACK_DESCRIPTION := Project scaffolding: fnew, and the tools it drives on demand (about 70 MB)

# Not offered, in any list: it arrives with the pack that requires it and
# leaves with the last one that does.
PACK_VISIBLE := no

# What `build` prints on the welcome screen of a fresh instance: the line
# travels with the command it names.
PACK_WELCOME := Run 'cd projects' and type 'fnew' to create your first project.

# No PACK_PACKAGES: nothing from apt. uv is what apt will never see, declared
# here for the same reason: a neighbour looks before taking it away. The python
# pack declares uv too - the first of the two to leave leaves it, the last
# takes it.
PACK_OUTSIDE_APT := uv
