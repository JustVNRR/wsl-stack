"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

format = """
${custom.active_venv}$directory
$git_branch$git_status$character"""

# Turn off the modules Starship would otherwise show on its own
[package]
disabled = true

[python]
disabled = true

[docker_context]
disabled = true

[custom.active_venv]
# A custom module re-runs this command at every prompt: the name is computed
# with the shell's own string operations - no basename/dirname/tr per prompt.
# Python's prompt is "(%s) ": the trailing space goes first.
when = 'test -n "$VIRTUAL_ENV_PROMPT" || test -n "$VIRTUAL_ENV"'
command = '''
if [ -n "$VIRTUAL_ENV_PROMPT" ]; then
    p=${VIRTUAL_ENV_PROMPT% }
    p=${p#\(}
    printf '%s\n' "${p%\)}"
else
    p=${VIRTUAL_ENV##*/}
    if [ "$p" = ".venv" ]; then
        d=${VIRTUAL_ENV%/*}
        printf '%s\n' "${d##*/}"
    else
        printf '%s\n' "$p"
    fi
fi
'''
format = '([\($output\) ](bold cyan))'

[directory]
format = "[\\[$path\\]](bold yellow)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = ""
format = "[$symbol $branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead      = "[⇡$count ](bold cyan)"
behind     = "[⇣$count ](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count ](bold cyan)"
staged     = "[+$count ](bold green)"
modified   = "[●$count ](bold yellow)"
untracked  = "[?$count ](bold white)"
deleted    = "[✘$count ](bold red)"
conflicted = "[⚡$count ](bold red)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"