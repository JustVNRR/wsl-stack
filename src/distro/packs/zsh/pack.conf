# ==============================================================================
# THE ZSH PACK
# ==============================================================================
# What the repository needs to know about it, and nothing more: the folder
# under packs/ is the registration - a pack is installed exactly when its
# folder is in ~/.config/packs - and no other file names the pack.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make.
PACK_DESCRIPTION := oh-my-zsh, Starship and daily CLI tools

# The apt family: a pack is only offered on a machine of the same one.
PACK_FAMILY := debian

# The system packages, named once: install_root.sh installs them, remove.sh
# removes them, and a neighbour reads this line before taking one away. The
# image installs the very same list in its Dockerfile - the pack is what
# dresses a foreign Debian with the same tools and settings, and on the built
# image every name here is already there.
#
# sudo is among them on purpose: every pack stands on this one, and the door
# the installs run behind needs it present.
PACK_PACKAGES := apt-transport-https apt-utils ca-certificates curl gnupg wget locales adduser sudo tzdata whiptail zsh nano git openssh-client strace lsof make less iputils-ping tree tar unzip bzip2 unrar p7zip-full gzip xz-utils zstd bat direnv eza fd-find fzf gh jq ripgrep rlwrap shellcheck zoxide sqlite3

# What apt will never see, read like PACK_PACKAGES: a neighbour looks for it
# before taking it away. Starship and tealdeer are static binaries the install
# puts in ~/.local/bin when the machine does not already carry them.
PACK_OUTSIDE_APT := starship tldr
