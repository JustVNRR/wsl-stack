# ==============================================================================
# THE OH_MY_CLOUD PACK
# ==============================================================================
# What the repository needs to know about it, and nothing more: the folder under
# packs/ is the registration - a pack is installed exactly when its folder is
# in ~/.config/packs - and no other file names the pack.

# The line `wsl.ps1 add_pack` shows in the list of packs. Kept ASCII: the file
# is read by PowerShell and by make.
PACK_DESCRIPTION := The Google Cloud CLI

# The apt family: a pack is only offered on a machine of the same one.
PACK_FAMILY := debian

# zsh: the shell - every visible pack stands on it. artifact_registry_build
# reads PACKAGE_NAME and DOCKER_BASE_IMAGE - the variables devops ships the
# sample for - so it is devops that says what a project is.
PACK_REQUIRES := oh_my_shell hide_my_ops

# The variables that identify a project. Never allowed in a shared .env.global,
# where one of them would silently retarget every project at once.
PACK_IDENTIFYING_VARS := GCP_PROJECT INSTANCE SA_NAME BUCKET_NAME BQ_DATASET TABLE_NAME GAR_IMAGE ARTIFACTSREPO SERVICE_URL
