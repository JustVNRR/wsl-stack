# ==============================================================================
# THE TEMPLATE PACK - WHAT A PACK TELLS THE REPOSITORY
# ==============================================================================
# This pack does nothing: its scripts only say they ran. It is the skeleton a
# new pack is copied from - duplicate it in the settings window (or copy the
# folder), rename, and fill it in.
#
# The folder under packs/ IS the pack: its name is the pack's name, and no
# other file names it. The keys below are what the catalogue reads; a value
# left out means the ordinary case.

# The line the pack lists show (add_pack, the build checklist, the window).
PACK_DESCRIPTION := The pack template - does nothing

# The apt family: a pack is only offered on a machine of the same one.
PACK_FAMILY := debian

# The packs that must be there before this one installs, by name.
PACK_REQUIRES := zsh

# The system packages, named once: install_root.sh installs them, remove.sh
# removes them, and a neighbour reads this line before taking one away.
# PACK_PACKAGES :=

# What apt will never see, read like PACK_PACKAGES.
# PACK_OUTSIDE_APT :=

# The one line the build says about the pack when it is installed.
# PACK_WELCOME :=

# `PACK_VISIBLE := no` withholds the pack from the lists - it still arrives
# with whatever requires it, and leaves with the last one that did.
# PACK_VISIBLE := no
