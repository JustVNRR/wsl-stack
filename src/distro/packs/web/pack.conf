# ==============================================================================
# THE WEB PACK
# ==============================================================================
# The folder under packs/ is the whole registration: a pack is installed
# exactly when its folder is in ~/.config/packs, where `.\wsl.ps1 add_pack`
# puts it. A browser inside the instance (its window lands on the Windows
# desktop through WSLg), and a WireGuard tunnel of your own: `fox`/`pfox` for
# the browser (docs/fox.md), the `vpn_*` targets for the tunnel (docs/vpn.md).

# The line `wsl.ps1 add_pack` shows. Kept ASCII: PowerShell and make both read
# this file.
PACK_DESCRIPTION := Firefox, and a WireGuard tunnel (about 550 MB installed)

# The packages, one reason each:
#   firefox             Mozilla's own repository - Ubuntu 24.04's package of
#                       that name installs the snap
#   dbus-x11            no session bus in the image, and Firefox never opens
#                       its first window without one
#   wireguard-tools     wg and wg-quick
#   kmod                modprobe - the module dies with `wsl --shutdown`
#   iproute2, iptables  wg-quick's routing, and the kill switch's rules
#   openresolv          the DNS - Debian's package (Ubuntu 24.04 has none);
#                       install_root.sh removes systemd-resolved to make room
# Never a library, and nothing is ever installed with autoremove. libavcodec60
# and libpulse0 are installed beside the browser by install_root.sh, and
# deliberately unnamed here. jq comes from the image.
PACK_PACKAGES := firefox dbus-x11 wireguard-tools kmod iproute2 iptables openresolv
