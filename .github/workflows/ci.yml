# ==============================================================================
# CHECKS
# ==============================================================================
# This repo is shell / zsh / make: no unit-test framework - the workflow runs
# static checks over the files, then the suites that run the code itself, on
# every push.
#
#   - shellcheck on real shell scripts (cheatsheets/*.sh are fcheat data files,
#     not executable shell - excluded, the socle's and the packs' alike)
#   - zsh -n on all zsh config files (syntax only, nothing is executed)
#   - the colour codes stay in their files: a `\033[` anywhere else is a call
#     site that went back to writing the codes itself
#   - make reads the Makefile and every include; the help menu is asserted with
#     and without the packs' folders, and the *_commands.sh cheatsheets are
#     compared against it, both ways
#   - documentation coverage: every make/*.mk has its doc page, linked from the
#     README; every workflow is named there; every target is in a cheatsheet;
#     templates.tsv is four columns ending in a known tool
#   - the docs and the menu say the same words (tests/doc-drift.sh)
#
# The second job, on windows-latest, is the one that RUNS the code instead of
# reading it, because that is where PowerShell and wsl.exe are: every .ps1 must
# parse under PowerShell 7 first, then thirteen suites, none of which needs an
# instance, a console or Docker Desktop. Every bug the scripts themselves have
# had was caught there, and none of these checks can be replaced by reading the
# files.
# ==============================================================================

name: Checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Shellcheck (real shell scripts)
        run: |
          find . -type f -name '*.sh' \
            -not -path './zsh/cheatsheets/*' \
            -not -path './packs/*/cheatsheets/*' -print0 |
            xargs -0 -r shellcheck

      - name: Zsh syntax (zsh -n, no execution)
        run: |
          # packs/ too: a pack may ship zsh files of its own, and nothing else
          # would read them.
          find zsh packs -type f \( -name '*.zsh' -o -name '.zshrc' \) -print0 |
            xargs -0 -r -n1 zsh -n

      - name: The colour codes stay in their files
        run: |
          # A message names a kind, and a code is written once per world:
          # zsh/lib/colours.sh for the shell, zsh/gmake/make/colours.mk for
          # make. The claude status line is the exception - shared byte for
          # byte with the Windows copy. Anywhere else, a call site went back to
          # writing the code itself, and a comment cannot notice that.
          bad=0
          while IFS= read -r hit; do
            case "$hit" in
              ./zsh/lib/colours.sh:* | ./zsh/gmake/make/colours.mk:* | ./packs/claude/bin/statusline.sh:*) ;;
              *)
                echo "::error::a colour code outside the colour files: $hit"
                bad=1
                ;;
            esac
          done < <(grep -rnF '\033[' --exclude-dir=.git \
                     --include='*.sh' --include='*.zsh' --include='.zshrc' \
                     --include='*.mk' --include='Makefile' . || true)
          exit $bad

      - name: Makefile parse + help menu
        run: |
          # The menu is what the repository carries: the socle's targets and
          # every pack's, since packs/ is right there. The steps below compare
          # the cheatsheets against it.
          make -f zsh/gmake/Makefile help |
            sed 's/\x1b\[[0-9;]*m//g' > help.txt
          missing=0
          for target in test test-fast test-functional test-gcp \
                        lint lint-py lint-sh lint-format \
                        copier_project cruft_project \
                        cloudrun_deploy bigquery_show vm_create \
                        gcp_project_list gh_pr_create docker_build_local; do
            grep -q "^  ${target}[[:space:]]" help.txt || {
              echo "::error::target '${target}' missing from gmake help"
              missing=1
            }
          done
          exit $missing

      - name: A pack's targets follow its folder
        run: |
          # What an instance without the pack looks like: the folder is the
          # whole switch, so PACKS_DIR at an empty one is the same thing - no
          # gate to force, nothing to keep in step by hand.
          mkdir -p /tmp/no-packs
          make -f zsh/gmake/Makefile PACKS_DIR=/tmp/no-packs help |
            sed 's/\x1b\[[0-9;]*m//g' > help-bare.txt
          bad=0
          if grep -qE '^  (gcp_auth_cli|cloudrun_deploy|vm_create|bigquery_show|gcs_list_buckets)[[:space:]]' help-bare.txt; then
            echo "::error::a pack target is in the menu without the pack's folder"
            bad=1
          fi
          # The way in is not a target any more, and neither is the way out:
          # a pack is installed and removed from Windows, by wsl.ps1.
          if grep -qE '^  (gcp_install|gcp_uninstall)[[:space:]]' help-bare.txt; then
            echo "::error::gcp_install/gcp_uninstall are gone - a pack arrives from Windows"
            bad=1
          fi
          # A pack's targets go with its folder, scaffolding as much as python:
          # lint and the test lanes live in packs/python/make/*.mk, the three
          # *_project targets in packs/scaffold/make/*.mk - and scaffold comes
          # with python, so a bare instance has neither.
          if grep -qE '^  (lint|lint-py|lint-sh|lint-format|test|test-fast|test-functional|test-gcp|copier_project|cruft_project|ccds_project)[[:space:]]' help-bare.txt; then
            echo "::error::a scaffolding or python pack target is in the menu without the pack's folder"
            bad=1
          fi
          # The devops targets build and push ONE project, and an instance
          # whose folders are empty has none. The .env targets are not on this
          # list: they went back to the socle, and the loop below keeps them
          # there.
          if grep -qE '^  (docker_build_local|docker_run_local|gh_pr_create|gh_pr_toreview|gh_pr_wip|gh_pr_ls)[[:space:]]' help-bare.txt; then
            echo "::error::a devops pack target is in the menu without the pack's folder"
            bad=1
          fi
          # The claude pack's target, same reason: a folder that is not there
          # puts no line in the menu.
          if grep -qE '^  claude_[a-z_]+[[:space:]]' help-bare.txt; then
            echo "::error::a claude pack target is in the menu without the pack's folder"
            bad=1
          fi
          # And the socle loses nothing to an empty packs folder
          for target in help packs_list env_global_enable env_global_manage env_project_enable env_project_manage \
                         wsl_config dns_resolve fstab_config wsl_status \
                         systemd_up systemd_down automount_up automount_down interop_up interop_down \
                         windows_path_up windows_path_down fstab_up fstab_down; do
            grep -q "^  ${target}[[:space:]]" help-bare.txt || {
              echo "::error::socle target '${target}' missing from the menu with no pack"
              bad=1
            }
          done
          exit $bad

      - name: No pack redefines a socle macro
        run: |
          # The socle's modules are read first and the packs' after, so a
          # pack's own `define check_vars` would win in silence and every
          # caller - its neighbours' included - would lose its check.
          bad=0
          for macro in check_vars confirm_action merge_env_samples; do
            if grep -rln "^define $macro$" packs/*/make/*.mk 2>/dev/null | grep -q .; then
              echo "::error::a pack defines $macro - the socle defines it in zsh/gmake/make/"
              bad=1
            fi
          done
          exit $bad

      - name: packs_list lists what the user chose
        run: |
          # A pack marked invisible is in no list, this one included: it is a
          # shared dependency, and the command answers "what did I ask for?".
          # Played on a folder of its own, so the repo's own packs cannot make
          # the check pass by accident.
          mkdir -p /tmp/packs-list/asked /tmp/packs-list/hidden
          printf 'PACK_DESCRIPTION := The one the user chose\n' > /tmp/packs-list/asked/pack.conf
          printf 'PACK_DESCRIPTION := The one nobody chooses\nPACK_VISIBLE := no\n' > /tmp/packs-list/hidden/pack.conf
          make -f zsh/gmake/Makefile PACKS_DIR=/tmp/packs-list packs_list > list.txt
          bad=0
          grep -q "asked" list.txt || { echo "::error::packs_list dropped a pack the user chose"; bad=1; }
          grep -q "hidden" list.txt && { echo "::error::packs_list listed a pack marked PACK_VISIBLE := no"; bad=1; }
          # And the other state, when a removal stopped half way: a dependency
          # left alone. It says so rather than print the header over nothing.
          rm -rf /tmp/packs-list/asked
          make -f zsh/gmake/Makefile PACKS_DIR=/tmp/packs-list packs_list > list-only.txt
          grep -q "These packs are dependencies" list-only.txt || {
            echo "::error::packs_list does not say what is left when only a dependency is installed"
            bad=1
          }
          exit $bad

      - name: Cheatsheet doc drift (*_commands.sh vs gmake help)
        run: |
          # Comment lines are skipped, as the picker itself does: prose can
          # name a target without offering it - `# requires: gcloud`, or a
          # sentence about the menu.
          grep -hvE '^[[:space:]]*#' zsh/cheatsheets/*_commands.sh \
                                       packs/*/cheatsheets/*_commands.sh |
            grep -oE 'gmake [a-zA-Z_-]+' |
            awk '{print $2}' | sort -u > documented.txt
          missing=0
          while read -r target; do
            grep -q "^  ${target}[[:space:]]" help.txt || {
              echo "::error::'${target}' documented in a *_commands.sh cheatsheet but missing from gmake help"
              missing=1
            }
          done < documented.txt
          exit $missing

      - name: Documentation coverage
        run: |
          missing=0
          # A module is fully documented when: its doc page exists, the README
          # index links it, and the README tree lists the .mk file
          for mk in zsh/gmake/make/*.mk; do
            name=$(basename "$mk" .mk)
            [ -f "docs/make/${name}.md" ] || {
              echo "::error::module '${name}' has no doc page (docs/make/${name}.md)"
              missing=1
            }
            grep -q "docs/make/${name}.md" README.md || {
              echo "::error::doc page of module '${name}' not linked from the README index"
              missing=1
            }
            grep -q "${name}.mk" README.md || {
              echo "::error::'${name}.mk' missing from the README project structure tree"
              missing=1
            }
          done
          # No orphan doc pages either
          for doc in docs/make/*.md; do
            name=$(basename "$doc" .md)
            [ -f "zsh/gmake/make/${name}.mk" ] || {
              echo "::error::orphan doc page: ${doc} has no matching module"
              missing=1
            }
          done
          # A pack documents itself inside the pack, so it stays one folder
          # that moves as a whole; the README links the pack, not each page.
          # A page that documents no module still has to be reachable, or it is
          # a page nobody will ever open.
          for pack_dir in packs/*/; do
            pack=$(basename "$pack_dir")
            # A pack's modules, and only those: the way in is a script at the
            # root, so make/ is the whole of what it offers.
            for mk in "$pack_dir"make/*.mk; do
              [ -f "$mk" ] || continue
              name=$(basename "$mk" .mk)
              [ -f "${pack_dir}docs/${name}.md" ] || {
                echo "::error::pack '${pack}': module '${name}' has no doc page (${pack_dir}docs/${name}.md)"
                missing=1
              }
            done
            for doc in "$pack_dir"docs/*.md; do
              name=$(basename "$doc" .md)
              [ -f "${pack_dir}make/${name}.mk" ] || grep -q "$doc" README.md || {
                echo "::error::orphan pack page: ${doc} documents no module and the README does not link it"
                missing=1
              }
            done
          done
          # Every docs/ folder the README names must exist - a renamed
          # directory used to survive unnoticed (docs/gcp/ stayed named long
          # after its page had moved out of it)
          grep -oE 'docs/[a-z_]+/' README.md | sort -u > readme_docs.txt
          while read -r d; do
            [ -d "$d" ] || {
              echo "::error::README names '${d}', which does not exist"
              missing=1
            }
          done < readme_docs.txt
          # Every target visible in gmake help (except the menu itself) must
          # be documented in a *_commands.sh cheatsheet
          awk '/^  /{print $1}' help.txt | grep -vx -e help -e make > help_targets.txt
          # Same cut as the drift check: what the picker offers is what has to
          # document the menu, comments excluded.
          grep -hvE '^[[:space:]]*#' zsh/cheatsheets/*_commands.sh \
                                       packs/*/cheatsheets/*_commands.sh > sheet_lines.txt
          while read -r target; do
            grep -q "gmake ${target}\b" sheet_lines.txt || {
              echo "::error::target '${target}' not documented in any *_commands.sh cheatsheet"
              missing=1
            }
          done < help_targets.txt
          # Every workflow must be named in the README, so the CI section there
          # cannot silently lose one - the make/*.mk rule, again.
          for wf in .github/workflows/*.yml; do
            name=$(basename "$wf")
            grep -q "$name" README.md || {
              echo "::error::workflow '${name}' is not named in the README"
              missing=1
            }
          done
          exit $missing

      - name: The docs and the menu say the same words
        run: bash tests/doc-drift.sh

      - name: Template catalog integrity (templates.tsv)
        run: |
          # The picker reads every pack's catalog: four tab-separated columns,
          # and a tool this repository knows how to run. A pack may ship none,
          # but one must exist somewhere - a glob that matches nothing would
          # let the check pass in silence.
          catalogs=$(ls packs/*/cheatsheets/templates.tsv 2>/dev/null)
          if [ -z "$catalogs" ]; then
            echo "::error::no pack ships a template catalog - fnew would have nothing to read"
            exit 1
          fi
          awk -F'\t' '
            /^[[:space:]]*(#|$)/ { next }
            {
              sub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              if (NF != 4) {
                print "Malformed row (4 tab-separated columns expected) in " FILENAME ": " $0
                bad = 1
              } else if ($2 !~ /^(copier|cruft|ccds)$/) {
                print "Unknown tool: " $2 " in " FILENAME " (expected copier, cruft or ccds)"
                bad = 1
              }
            }
            END { exit bad }
          ' $catalogs

  # The suites that run the code - the only checks here that have ever caught a
  # bug in the scripts themselves - and none needs an instance, a console or
  # Docker Desktop, so they are free to run on every push. Every suite still
  # runs when an earlier one failed: one push reports them all.
  tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell files parse
        shell: bash
        run: pwsh -NoProfile -File tests/parse-check.ps1

      - name: The window's files - the XAML well-formed, the theme's keys, the runners pinned
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/gui-test.ps1

      # The answers, where a suite reads them from the numbered prompt, come
      # from the .answers file beside it, never a copy spelled out here: a
      # second copy drifts - this file listed the answers of the day it was
      # written while the suite grew.

      - name: The arrow menu, driven by a scripted keyboard
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/menu-test.ps1 < tests/menu-test.answers

      - name: The way in, driven by a scripted terminal
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/wslui-test.ps1

      - name: The pack checklist, and what it applies
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/packs-select-test.ps1 < tests/packs-select-test.answers

      - name: build's questions, with a stand-in docker
        if: always()
        shell: bash
        run: bash tests/build-question-test.sh

      - name: The name a Windows account proposes, cleaned into a user name
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/user-name-test.ps1

      - name: The icon an instance is given, from its name
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/icon-test.ps1

      - name: Choosing an instance's icon, on an instance of the test's own
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/icon-command-test.ps1

      - name: Choosing an instance's font, on an instance of the test's own
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/font-command-test.ps1

      - name: Choosing an instance's colours, on an instance of the test's own
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/color-command-test.ps1

      - name: The colour a message takes, on schemes the test writes out
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/message-test.ps1

      - name: Starting and restarting an instance, with a stand-in wsl
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/lifecycle-command-test.ps1

      - name: Archiving, restoring and copying, with a stand-in wsl
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/archive-command-test.ps1

      - name: Removing an instance, with a stand-in wsl
        if: always()
        shell: bash
        run: pwsh -NoProfile -File tests/unregister-command-test.ps1
